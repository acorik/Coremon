# Compila todas las versiones del juego:
#   web (zip para itch.io) · Android (APK) · Windows (instalador y portable) · Linux (AppImage) · macOS (dmg)
# Los archivos quedan en la pestaña Actions (Artifacts). Al publicar una release
# con una etiqueta tipo v1.0.0, se adjuntan automáticamente a la release.
name: Builds

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['index.html', 'manifest.webmanifest', 'css/**', 'js/**', 'icons/**', 'android/**', 'desktop/**', 'tools/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coremon-web
          path: dist/*.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Firma de release: secretos COREMON_KEYSTORE_BASE64 y COREMON_KEYSTORE_PASSWORD.
      # Sin ellos se firma con una clave de depuración (instalable, pero no actualizable
      # encima de la versión firmada con la clave oficial).
      - name: Clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.COREMON_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/coremon.jks"
            echo "COREMON_KEYSTORE=$RUNNER_TEMP/coremon.jks" >> "$GITHUB_ENV"
          fi
      - name: Compilar APK
        working-directory: android
        env:
          COREMON_KEYSTORE_PASSWORD: ${{ secrets.COREMON_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          VERSION=$(sed -n "s/^const GAME_VERSION = '\(.*\)';/\1/p" ../js/game.js)
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk "../dist/Coremon-${VERSION}.apk"
          # Sin la clave oficial en los secretos, se publica el APK oficial ya firmado
          # que está en android/release/ (si existe para esta versión).
          if [ -z "${COREMON_KEYSTORE:-}" ] && [ -f "release/Coremon-${VERSION}.apk" ]; then
            cp "release/Coremon-${VERSION}.apk" "../dist/Coremon-${VERSION}.apk"
            echo "Usando el APK oficial firmado de android/release/"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: coremon-android
          path: dist/*.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Empaquetar con Electron
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: coremon-${{ runner.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Coremon ${{ github.ref_name }}
          body_path: launch/RELEASE_NOTES.md
          files: out/*
          make_latest: true
