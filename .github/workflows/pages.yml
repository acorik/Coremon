# Publica el juego en GitHub Pages cada vez que cambia la rama principal.
# Requisito (una vez): Settings → Pages → Source: "GitHub Actions".
name: GitHub Pages

on:
  push:
    paths: ['index.html', 'manifest.webmanifest', 'sw.js', 'coremon1/**', 'coremon2/**', 'icons/**', 'tools/build-web.sh']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: tools/build-web.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - id: deploy
        uses: actions/deploy-pages@v4
